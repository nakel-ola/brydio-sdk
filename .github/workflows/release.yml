# Publishing the SDK to npm, with no token anywhere (the owner, 17 Sep).
#
# npm's trusted publishing: GitHub Actions asks npm for a short-lived OIDC
# token at publish time, npm checks that this repository and this workflow
# are the ones the package names as its trusted publisher. Nothing is stored
# in the repository or in its secrets, and there is no `NODE_AUTH_TOKEN` or
# `NPM_TOKEN` in this file on purpose. npm provenance is unavailable while the
# source repository is private.
#
# A tag starting with `v` publishes. A pull request runs the same build and
# the same install test and publishes nothing, so the release path is
# exercised before it is used.
#
# Before the first release the owner has a one-off to do: see
# `docs/releasing.md`.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/release-build.ts'
      - '.github/workflows/release.yml'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build, check, and publish on a tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The OIDC token npm checks. `contents: read` is all the code needs.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      # npm does the publishing. Trusted publishing needs npm 11.5.1 or newer
      # and Node 22.14 or newer, so this pins a Node well past that and takes
      # the newest npm.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Use an npm that can publish with OIDC
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run check-types

      - name: Tests
        run: bun test

      # Compiles each package into release/<name>/ and refuses without a licence.
      - name: Build the packages as they are published
        run: bun run release:build

      - name: Check the tag matches the version being published
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          built=$(node -p "require('./release/manifest/package.json').version")
          if [ "$tagged" != "$built" ]; then
            echo "The tag says $tagged and the packages say $built. Tag the version you are publishing." >&2
            exit 1
          fi

      # The proof that what is about to be published works: the tarballs are
      # installed into a fresh app with no workspace links, which then builds,
      # validates, tests and type-checks (`packages/cli/test/release.test.ts`).
      - name: Install the tarballs into a new app
        run: bun test packages/cli/test/release.test.ts

      # Each package is published from its own built folder, in the order they
      # depend on one another. No token: npm asks GitHub for an OIDC one, and
      # setting NODE_AUTH_TOKEN here would turn trusted publishing off.
      - name: Publish, in dependency order
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: release
        run: |
          set -euo pipefail
          for package in manifest ui app api fake-host cli; do
            echo "Publishing @brydio/$package"
            (cd "$package" && npm publish --access public --tag next)
          done
